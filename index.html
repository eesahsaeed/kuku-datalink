<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/app/assets/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Essential Meta Tags -->
    <title>
      Kuku Data - Cheap Mobile Data, Airtime, TV Subscriptions & Bill Payments
      in Nigeria
    </title>
    <meta
      name="description"
      content="Kuku Data: Buy cheap mobile data bundles for MTN, Airtel, Glo & 9mobile, instant airtime top-up, DSTV/GOTV/Startimes subscriptions, and pay electricity bills online. Fast, affordable & reliable in Nigeria!"
    />

    <!-- Viewport for Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Keywords (optional, but still used by some engines) -->
    <meta
      name="keywords"
      content="cheap data Nigeria, buy data online, airtime recharge, DSTV subscription, GOTV payment, Startimes, electricity bill payment, MTN data, Airtel data, Glo data, 9mobile data, VTU Nigeria"
    />

    <!-- Open Graph / Facebook Tags -->
    <meta
      property="og:title"
      content="Kuku Data - Affordable Data, Airtime & Bill Payments in Nigeria"
    />
    <meta
      property="og:description"
      content="Get the cheapest mobile data bundles, instant airtime, cable TV subscriptions (DSTV, GOTV, Startimes), and utility bill payments. Fast and secure recharge anytime!"
    />
    <meta property="og:url" content="https://kuku.com.ng/" />
    <meta property="og:site_name" content="Kuku Data" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kuku.com.ng/og-image.jpg" />
    <!-- Replace with your actual 1200x630 image URL -->
    <meta
      property="og:image:alt"
      content="Kuku Data - Cheap Data & Recharge Platform"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Card Tags (now X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Kuku Data - Affordable Data, Airtime & Bill Payments in Nigeria"
    />
    <meta
      name="twitter:description"
      content="Get the cheapest mobile data bundles, instant airtime, cable TV subscriptions (DSTV, GOTV, Startimes), and utility bill payments. Fast and secure recharge anytime!"
    />
    <meta name="twitter:image" content="https://kuku.com.ng/og-image.jpg" />
    <!-- Same as OG image or a 1200x675 version if you have one -->
    <meta
      name="twitter:image:alt"
      content="Kuku Data - Cheap Data & Recharge Platform"
    />
    <meta name="twitter:site" content="@yourtwitterhandle" />
    <!-- Optional: Add your X/Twitter handle if you have one -->

    <!-- Additional Recommended Tags -->
    <link rel="canonical" href="https://kuku.com.ng/" />
    <meta name="theme-color" content="#000000" />
    <!-- Change to your brand color -->
    <meta name="author" content="Kuku Data" />

    <!-- Favicon (add these if not already present) -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
